<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 암기장</title>
    <link rel="stylesheet" href="wordtest2.css">
</head>
<body>
    <h1>단어 암기장</h1>
    <h3><a href="https://github.com/nakano79/Wordtest">사용법</a></h3>
    <input type="file" id="csvFile" accept=".csv">
    <div class="mode-options">
        <label><input type="radio" name="matchMode" value="partial" checked>하나의 뜻만 맞아도 정답 처리</label>
        <label><input type="radio" name="matchMode" value="exact">모든 뜻이 정확히 일치해야 정답 처리</label>
    </div>
    
    <div id="result"></div>

    <div id="wordContainer"></div>
    <div class="btn-container">
        <button onclick="checkAnswers()">채점하기</button>
    </div>

    <script src="wordtest2.js"></script>
</body>
</html>
