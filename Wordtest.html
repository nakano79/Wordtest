<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어 암기장</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fc;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            height: 100vh;
            overflow-y: auto;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #333;
        }

        input[type="file"] {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }

        #wordContainer {
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }

        .word-pair {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .word-pair label {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .word-pair input {
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 5px;
            transition: border-color 0.3s;
        }

        .word-pair input:focus {
            border-color: #5cb85c;
            outline: none;
        }

        #result {
            display: none;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .wrong {
            border-color: red;
            background-color: #f8d7da;
        }

        .btn-container {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #5bc0de;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #31b0d5;
        }

        .mode-options {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
        }

        .mode-options label {
            font-size: 1rem;
            margin: 0;
        }

        @media screen and (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .word-pair input {
                padding: 8px;
                font-size: 0.9rem;
            }

            button {
                font-size: 0.9rem;
                padding: 8px 16px;
            }

            .mode-options {
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <h1>단어 암기장</h1>
    <input type="file" id="csvFile" accept=".csv">
    <div class="mode-options">
        <label><input type="radio" name="matchMode" value="partial" checked>하나의 뜻만 맞아도 정답 처리</label>
        <label><input type="radio" name="matchMode" value="exact">모든 뜻이 정확히 일치해야 정답 처리</label>
    </div>
    
    <div id="result"></div>

    <div id="wordContainer"></div>
    <div class="btn-container">
        <button onclick="checkAnswers()">채점하기</button>
    </div>

    <script>
        const wordContainer = document.getElementById('wordContainer');
        const resultDiv = document.getElementById('result');
        let wordPairs = [];

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();

            reader.onload = function(event) {
                const contents = event.target.result;
                const decoder = new TextDecoder('euc-kr');
                const decodedContents = decoder.decode(new Uint8Array(contents));
                parseCSV(decodedContents);
                displayWords();
            };
            reader.readAsArrayBuffer(file);
        });

        function parseCSV(csvText) {
            wordPairs = [];
            const lines = csvText.split('\n');
            for (const line of lines) {
                if (line.trim() === "") continue;
                const parts = line.split(',');
                if (parts.length >= 2) {
                    wordPairs.push({ word: parts[0].trim(), meanings: parts[1].split('/').map(m => m.trim()) });
                }
            }
        }

        function displayWords() {
            wordContainer.innerHTML = '';
            for (let i = wordPairs.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [wordPairs[i], wordPairs[j]] = [wordPairs[j], wordPairs[i]];
            }
            let showWord = Math.random() < 0.5;
            for (const pair of wordPairs) {
                const div = document.createElement('div');
                div.className = 'word-pair';
                const input = document.createElement('input');
                const label = document.createElement('label');
                if (showWord) {
                    label.textContent = pair.word;
                    input.dataset.answer = pair.meanings.join('/');
                    input.dataset.type = 'meaning';
                } else {
                    label.textContent = pair.meanings.join('/');
                    input.dataset.answer = pair.word;
                    input.dataset.type = 'word';
                }
                div.appendChild(label);
                div.appendChild(input);
                wordContainer.appendChild(div);
                showWord = !showWord;
            }
        }

        function checkAnswers() {
            resultDiv.style.display = 'block';
            resultDiv.textContent = '';
            const inputs = document.querySelectorAll('#wordContainer input');
            let correctCount = 0;
            const matchMode = document.querySelector('input[name="matchMode"]:checked').value;

            inputs.forEach(input => {
                const userAnswer = input.value.trim();
                const correctAnswer = input.dataset.answer;
                const correctMeanings = correctAnswer.split('/');

                let isCorrect = false;

                if (matchMode === "partial") {
                    isCorrect = correctMeanings.some(meaning => userAnswer === meaning);
                } else {
                    isCorrect = correctMeanings.every(meaning => userAnswer.includes(meaning));
                }
                
                if (isCorrect) {
                    correctCount++;
                    input.classList.remove('wrong');
                } else {
                    input.classList.add('wrong');
                }
            });
            resultDiv.textContent = `맞춘 개수: ${correctCount} / ${wordPairs.length}`;
        }
    </script>
</body>
</html>
